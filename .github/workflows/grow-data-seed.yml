name: grow-data-seed

on:
  workflow_dispatch:
    inputs:
      gib:
        description: Target container size in GiB (3..1024)
        required: true
        default: "8"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  grow:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out UniXNU (holds the grow script)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show the environment
        run: |
          set -x
          uname -a
          sw_vers || true
          python3 -V
          which hdiutil diskutil || true
          ls -l
          ls -l unixnu/scripts/seed-data-grow.py
          python3 -c "import packed_ramdisk; print('packed_ramdisk OK', packed_ramdisk.__file__)"

      - name: Grow the APFS container
        run: |
          set -eux
          seed=$(find . -path ./unixnu -prune -o -name '*.dbr' -print | head -1)
          echo "seed=$seed"
          test -n "$seed" || { echo "no .dbr in repository"; exit 1; }
          mkdir -p unixnu/build out
          python3 unixnu/scripts/seed-data-grow.py \
            --gib "${{ inputs.gib }}" \
            "$seed" \
            out/owner-data-grown.dbr
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: owner-data-grown
          path: out/owner-data-grown.dbr
          if-no-files-found: error
          retention-days: 7
